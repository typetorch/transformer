# @typetorch/transformer: the TypeScript build and the end-to-end fixture (test-project/scripts/run.ts: packs the
# transformer, compiles a stand-in framework and a Model project with it, builds the model with Rojo and runs two
# generations of the emitted Luau under Lune). Rojo and Lune come from test-project/rokit.toml.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: build and fixture
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Rokit tools (rojo, lune) for the fixture
        uses: CompeyDev/setup-rokit@v0.2.1
        with:
          path: test-project
          cache: "true"
      - name: Install
        run: bun install --frozen-lockfile
      - name: Build (tsc)
        run: bun run build
      - name: Fixture (bun run test)
        run: bun run test
